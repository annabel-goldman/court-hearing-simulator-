[project]
name = "court-hearing-simulator"
version = "0.1.0"
description = "Moot-court hearing simulator backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "hypercorn[trio]>=0.16.0",
    "anyio[trio]>=4.4.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "openai>=1.3.7",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pypdf>=3.17.0",
    "json-repair>=0.28.0",
]

# Install local inference dependencies with: uv sync --extra local
# These pull in CUDA/CTranslate2 wheels (~2 GB) not needed for cloud deployments.
[project.optional-dependencies]
local = [
    "faster-whisper>=1.0.0",
    "sentence-transformers>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
