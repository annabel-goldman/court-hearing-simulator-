[project]
name = "court-hearing-simulator-backend"
version = "0.1.0"
description = "Backend for Court Hearing Simulator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "openai>=1.3.7",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pypdf>=3.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "pipeline", "facial_analysis"]

