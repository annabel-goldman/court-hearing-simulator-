<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Bench logo">
  <defs>
    <linearGradient id="benchFill" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3DEC0"/>
      <stop offset="0.5" stop-color="#E2C491"/>
      <stop offset="1" stop-color="#C79658"/>
    </linearGradient>
    <linearGradient id="lineFill" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D3A565" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#D3A565" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#D3A565" stop-opacity="1"/>
      <stop offset="1" stop-color="#D3A565" stop-opacity="0"/>
    </linearGradient>
    <filter id="benchShadow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feOffset dx="0" dy="6"/>
      <feGaussianBlur stdDeviation="6"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.09 0 0 0 0 0.05 0 0 0 0 0.02 0 0 0 0.55 0"/>
      <feBlend mode="normal" in2="SourceGraphic" result="shape"/>
    </filter>
  </defs>

  <g filter="url(#benchShadow)">
    <path d="M150 180H1048" stroke="url(#lineFill)" stroke-width="1.6"/>
    <path d="M150 136H1048" stroke="url(#lineFill)" stroke-width="1"/>
    <path d="M150 224H1048" stroke="url(#lineFill)" stroke-width="1"/>

    <path d="M208 180L238 150L268 180L238 210L208 180Z" fill="#D3A565" fill-opacity="0.58"/>
    <path d="M932 180L962 150L992 180L962 210L932 180Z" fill="#D3A565" fill-opacity="0.58"/>

    <text x="600" y="196" text-anchor="middle" fill="url(#benchFill)" font-family="Cinzel, Times New Roman, Georgia, serif" font-size="124" font-weight="700" letter-spacing="6">
      The Bench
    </text>

    <path d="M410 250H790" stroke="#E3C798" stroke-opacity="0.46" stroke-width="1"/>
  </g>
</svg>
