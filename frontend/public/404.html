<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Court Simulator</title>
  <script>
    // GitHub Pages SPA redirect
    // This script redirects 404s to index.html with the path stored in sessionStorage
    // so React Router can handle the route client-side
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    // Store the intended path
    sessionStorage.setItem('spa-redirect', path + search + hash);
    
    // Redirect to the base path (root of the app)
    const basePath = '/court-hearing-simulator-/';
    window.location.replace(basePath);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
