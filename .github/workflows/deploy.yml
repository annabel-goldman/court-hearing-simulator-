name: Deploy to GitHub Pages

on:
  push:
    branches: [court-room, court-hearing]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy'
        required: true
        default: 'court-room'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build
        working-directory: ./frontend
        env:
          # For project pages, set this to your repo name
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # API keys from GitHub Secrets
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Production backend (set in repo Secrets for deploy)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        run: bun run build

      - name: Write deploy info (verify which branch is live)
        run: |
          echo '{"branch":"${{ github.ref_name }}","sha":"${{ github.sha }}"}' > frontend/dist/deploy-info.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

      - name: Trigger Render backend deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render backend deploy..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Backend deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set; skipping backend deploy trigger."
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
