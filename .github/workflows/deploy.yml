name: Deploy to GitHub Pages

on:
  push:
    branches: [court-room, court-hearing]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy'
        required: true
        default: 'court-room'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build
        working-directory: ./frontend
        env:
          # For project pages, set this to your repo name
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # API keys from GitHub Secrets
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Production backend (set in repo Secrets for deploy)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          # Toggle + base URL for optional S3/CloudFront-hosted frontend assets
          VITE_USE_S3_ASSETS: ${{ secrets.VITE_USE_S3_ASSETS }}
          # S3/CloudFront base URL for heavy frontend assets (GLB/background/logo)
          VITE_ASSET_BASE_URL: ${{ secrets.VITE_ASSET_BASE_URL }}
        run: bun run build

      - name: Write deploy info (verify which branch is live)
        run: |
          echo '{"branch":"${{ github.ref_name }}","sha":"${{ github.sha }}"}' > frontend/dist/deploy-info.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger Render backend deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set"
            exit 1
          fi

          echo "Triggering Render backend deploy for commit $TARGET_SHA..."
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}?ref=${TARGET_SHA}"
          echo
          echo "Backend deploy triggered."

      - name: Wait for backend health check to match deployed commit
        env:
          BACKEND_URL: ${{ secrets.VITE_API_URL }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "VITE_API_URL secret is not set"
            exit 1
          fi

          export HEALTH_URL="${BACKEND_URL%/}/healthz"
          echo "Polling $HEALTH_URL for commit $TARGET_SHA"

          python - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          health_url = os.environ["HEALTH_URL"]
          target_sha = os.environ["TARGET_SHA"]
          deadline = time.time() + 15 * 60
          last_error = "no response yet"

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(health_url, timeout=10) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  commit = (payload.get("commit") or "").strip()
                  ok = bool(payload.get("ok"))
                  print(f"healthz ok={ok} commit={commit or '<empty>'}")
                  if ok and commit == target_sha:
                      print("Backend deploy is live on the expected commit.")
                      sys.exit(0)
                  last_error = f"healthy but running commit {commit or '<empty>'}"
              except Exception as exc:
                  last_error = str(exc)
                  print(f"healthz probe failed: {last_error}")
              time.sleep(10)

          print(f"Timed out waiting for backend deploy: {last_error}", file=sys.stderr)
          sys.exit(1)
          PY
