services:
  backend:
    build: ./backend
    container_name: court-simulator-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: court-simulator-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
